<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f5f7ff"/><title>나의 여행자 프로필 | enjoytrip</title><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="assets/vendor/bootstrap.min.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/><link rel="stylesheet" href="assets/css/service.css"/><script type="module" src="assets/js/mypage.js"></script></head><body class="service-page"><a class="skip-link" href="#main">본문으로 바로가기</a><header class="service-header" id="siteHeader"></header><main class="container-xl service-main" id="main"><div class="page-heading"><p class="eyebrow">HELLO AGAIN, TRAVELER.</p><h1>나의 여행자 프로필<span>.</span></h1><p>회원 정보를 관리하고, 이 브라우저에 담아둔 여행을 확인하세요.</p></div><div id="accountGate" class="panel empty-state" hidden><h2>로그인이 필요해요.</h2><button class="button button-primary" id="accountLogin">로그인 / 회원가입</button></div><div id="accountContent"><div class="row g-4"><section class="col-lg-7"><div class="panel"><h2>회원 정보</h2><form id="profileForm"><label class="form-label" for="profileUsername">아이디</label><input id="profileUsername" class="form-control" readonly/><label class="form-label mt-3" for="profileName">이름</label><input id="profileName" class="form-control" required maxlength="30"/><label class="form-label mt-3" for="profileEmail">이메일</label><input id="profileEmail" type="email" class="form-control" required maxlength="100"/><label class="form-label mt-3" for="currentPassword">현재 비밀번호</label><input id="currentPassword" type="password" class="form-control" required autocomplete="current-password"/><label class="form-label mt-3" for="newPassword">새 비밀번호 (변경할 때만)</label><input id="newPassword" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password"/><label class="form-label mt-3" for="newPasswordConfirm">새 비밀번호 확인</label><input id="newPasswordConfirm" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password"/><p class="form-error" id="profileError" role="alert" hidden></p><button class="button button-primary mt-4" type="submit">정보 수정</button></form></div></section><aside class="col-lg-5"><div class="panel"><h2 id="profileGreeting">반가워요, 여행자님.</h2><p class="small text-secondary" id="memberSince"></p><div id="accountStats" class="account-stats"></div><div class="d-flex gap-2 mt-4"><button class="button button-secondary" id="exportData">내 데이터 백업</button><button class="button button-secondary" data-logout>로그아웃</button></div><p class="small text-secondary mt-3 mb-0">데이터는 현재 브라우저에 저장됩니다. 브라우저 데이터를 삭제하면 함께 사라져요.</p></div><div class="panel mt-4"><h2 class="text-danger">회원 탈퇴</h2><p class="small text-secondary">탈퇴하면 내 회원 정보, 여행 계획, 찜, 핫플레이스와 게시글을 삭제합니다.</p><label class="form-label" for="deletePassword">비밀번호 확인</label><input id="deletePassword" type="password" class="form-control" autocomplete="current-password"/><button class="button button-danger mt-3" id="deleteAccount">회원 탈퇴</button></div></aside></div></div></main><footer class="service-footer container-xl" id="siteFooter"></footer><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
