<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f5f7ff"/><title>나만의 여행 계획 | enjoytrip</title><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="assets/vendor/bootstrap.min.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/><link rel="stylesheet" href="assets/css/service.css"/><script type="module" src="assets/js/planner.js"></script></head><body class="service-page"><a class="skip-link" href="#main">본문으로 바로가기</a><header class="service-header" id="siteHeader"></header><main class="container-xl service-main" id="main"><div class="page-heading"><p class="eyebrow">YOUR PLACES. YOUR PACE.</p><h1>나만의 여행 계획<span>.</span></h1><p>여행지, 일정, 예산을 한곳에. 드래그하거나 화살표로 방문 순서를 정해보세요.</p></div><div id="loginGate" class="panel empty-state" hidden><h2>로그인하고 나만의 여행을 만들어 보세요.</h2><p>여행 계획은 회원별로 이 브라우저에 저장됩니다.</p><button class="button button-primary" id="planLogin">로그인 / 회원가입</button></div><div id="plannerContent"><div class="section-bar"><div class="d-flex gap-2 flex-wrap align-items-center"><label for="planSelect" class="visually-hidden">저장된 여행</label><select id="planSelect" class="form-select compact-select"></select><button class="button button-secondary" id="newPlan">새 여행 ＋</button></div><div class="d-flex gap-2"><button class="button button-secondary" id="exportPlan">다운로드</button><button class="button button-primary" id="savePlan">계획 저장</button></div></div><form id="planForm" class="panel mb-4"><div class="row g-3"><div class="col-md-5"><label for="planName" class="form-label">여행 이름</label><input id="planName" class="form-control" required maxlength="60"/></div><div class="col-6 col-md-3"><label for="startDate" class="form-label">출발일</label><input type="date" id="startDate" class="form-control"/></div><div class="col-6 col-md-2"><label for="days" class="form-label">여행 기간</label><select id="days" class="form-select"><option value="1">1일</option><option value="2">2일</option><option value="3">3일</option><option value="4">4일</option><option value="5">5일</option><option value="6">6일</option><option value="7">7일</option></select></div><div class="col-md-2"><label for="budget" class="form-label">총 예산 (원)</label><input type="number" id="budget" min="0" max="1000000000" step="1" class="form-control" value="0"/></div><div class="col-12"><label for="planNote" class="form-label">상세 계획 / 메모</label><textarea id="planNote" class="form-control" rows="2" maxlength="2000" placeholder="준비물, 이동 방법, 함께하는 사람 등"></textarea></div></div></form><div class="planner-layout"><section class="panel route-list-panel"><div class="section-bar"><h2>방문할 장소</h2><a href="explore.html" class="text-link">관광지 추가 ↗</a></div><p class="small text-secondary">카드를 드래그하거나 ↑↓ 버튼으로 순서를 바꿀 수 있어요.</p><ol id="routeList" class="route-list"></ol><div class="budget-summary" id="budgetSummary"></div><button class="text-button text-danger mt-3" id="deletePlan">이 여행 삭제</button></section><section class="map-frame"><div id="map" class="travel-map" aria-label="여행 경로 지도"></div><p class="map-caption">점선은 방문 순서를 연결한 선입니다. 실제 이동 경로는 카카오 길찾기로 확인하세요.</p></section></div></div></main><footer class="service-footer container-xl" id="siteFooter"></footer><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
